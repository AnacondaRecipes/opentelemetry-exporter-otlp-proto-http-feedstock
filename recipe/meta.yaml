{% set name = "opentelemetry-exporter-otlp-proto-http" %}
{% set version = "1.45.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 45c218405ce3fd879596924b1874bf9a8f6880206d61065c5a912c8e5c297fb7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - googleapis-common-protos >=1.52,<2
    - opentelemetry-api >=1.15,<2
    - opentelemetry-proto =={{ version }}
    - opentelemetry-sdk =={{ version }}
    - opentelemetry-exporter-otlp-proto-common =={{ version }}
    - opentelemetry-exporter-otlp-common ==0.66b1
    - opentelemetry-exporter-http-transport ==0.66b1
    - requests >=2.7,<3
    - typing-extensions >=4.5.0

# 'mocket' is a test dependency of 'opentelemetry-test-utils', but mocket is not available on main.
# enable once it would be in main channel
# E   ModuleNotFoundError: No module named 'mocket'
{% set ignored_tests = "--ignore=tests/test_proto_log_exporter.py " %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_proto_span_exporter.py " %}
{% set ignored_tests = ignored_tests + " --ignore=tests/metrics/test_otlp_metrics_exporter.py" %}

test:
  source_files:
    - tests
  imports:
    - opentelemetry.exporter.otlp.proto.http
  commands:
    - pip check
    - pytest -vv tests {{ ignored_tests }}
  requires:
    - pip
    - pytest

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: OpenTelemetry Collector Protobuf over HTTP Exporter
  description: This library allows to export data to the OpenTelemetry Collector using the OpenTelemetry Protocol using Protobuf over HTTP.
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http
  doc_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-http

extra:
  recipe-maintainers:
    - mariusvniekerk
